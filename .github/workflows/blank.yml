# ═══════════════════════════════════════════════════════════════════════════════
#
#   ROCKSTAR TERMINAL — SOVEREIGN ORCHESTRATION
#
#   Compose file for local development and production-like testing.
#   Every service is a stage in the terminal's lifecycle.
#
#   Author  : Aissa Mohammedi (DGK)
#   License : NEXUS-OPEN-2.0
#   Build   : 2026.10.13
#
# ═══════════════════════════════════════════════════════════════════════════════

name: rockstar-terminal

# ───────────────────────────────────────────────────────────────────────────────
# NETWORKS — isolated sovereign fabric
# ───────────────────────────────────────────────────────────────────────────────
networks:
  sovereign:
    name: rockstar-sovereign
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/24

# ───────────────────────────────────────────────────────────────────────────────
# VOLUMES — persistent state outside the container
# ───────────────────────────────────────────────────────────────────────────────
volumes:
  rockstar-home:
    name: rockstar-home
  rockstar-memory:
    name: rockstar-memory
  rockstar-plugins:
    name: rockstar-plugins
  rockstar-workspace:
    name: rockstar-workspace
  rockstar-logs:
    name: rockstar-logs

# ───────────────────────────────────────────────────────────────────────────────
# SERVICES
# ───────────────────────────────────────────────────────────────────────────────
services:

  # ───────────────────────────────────────────────────────────────────────────
  # SERVICE 01 — ROCKSTAR TERMINAL (primary)
  # The sovereign terminal itself.
  # ───────────────────────────────────────────────────────────────────────────
  terminal:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        INSTALL_WHISPER: "0"
    image: rockstar-terminal:1.0.0
    container_name: rockstar-terminal
    hostname: rockstar
    restart: unless-stopped
    networks:
      - sovereign
    environment:
      TERM: xterm-256color
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      ROCKSTAR_TERMINAL_VERSION: "1.0.0"
      ROCKSTAR_TERMINAL_BUILD: "2026.10.13"
      ROCKSTAR_CODENAME: gina
      ROCKSTAR_VERBOSE: "0"
    volumes:
      - rockstar-home:/home/rockstar
      - rockstar-memory:/home/rockstar/.rockstar/memory
      - rockstar-plugins:/home/rockstar/.rockstar/plugins
      - rockstar-workspace:/home/rockstar/workspace
      - rockstar-logs:/home/rockstar/.rockstar/logs
    stdin_open: true
    tty: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    read_only: false
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /run:size=16M,mode=755
    healthcheck:
      test: ["CMD", "python3", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────────────
  # SERVICE 02 — GINA MEMORY SERVICE
  # Persistent memory sidecar for the terminal's autonomous assistant.
  # ───────────────────────────────────────────────────────────────────────────
  gina-memory:
    image: alpine:3.20
    container_name: rockstar-gina-memory
    hostname: gina-memory
    restart: unless-stopped
    networks:
      - sovereign
    command: >
      sh -c "mkdir -p /memory &&
             touch /memory/gina.db &&
             echo 'Gina memory service ready' &&
             tail -f /dev/null"
    volumes:
      - rockstar-memory:/memory
    healthcheck:
      test: ["CMD", "test", "-f", "/memory/gina.db"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ───────────────────────────────────────────────────────────────────────────
  # SERVICE 03 — VOICE BRIDGE (optional)
  # Speech-to-text bridge. Disabled by default (profile: voice).
  # ───────────────────────────────────────────────────────────────────────────
  voice-bridge:
    image: python:3.12-slim-bookworm
    container_name: rockstar-voice-bridge
    hostname: voice-bridge
    restart: unless-stopped
    networks:
      - sovereign
    profiles:
      - voice
    command: >
      bash -c "pip install --no-cache-dir openai-whisper &&
               python -c 'import whisper; print(\"Whisper ready\")' &&
               tail -f /dev/null"
    volumes:
      - rockstar-memory:/memory
    environment:
      WHISPER_MODEL: base
      WHISPER_LANGUAGE: fr
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ───────────────────────────────────────────────────────────────────────────
  # SERVICE 04 — TTS BRIDGE (optional)
  # Text-to-speech bridge. Disabled by default (profile: voice).
  # ───────────────────────────────────────────────────────────────────────────
  tts-bridge:
    image: debian:bookworm-slim
    container_name: rockstar-tts-bridge
    hostname: tts-bridge
    restart: unless-stopped
    networks:
      - sovereign
    profiles:
      - voice
    command: >
      bash -c "apt-get update &&
               apt-get install -y --no-install-recommends espeak-ng &&
               rm -rf /var/lib/apt/lists/* &&
               echo 'TTS bridge ready' &&
               tail -f /dev/null"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
